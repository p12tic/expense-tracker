name: Run frontend checks
run-name: Run frontend checks

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  frontend-e2e-tests:
    name: Frontend e2e tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: e2e/package-lock.json

    - name: Build and install dependencies
      working-directory: e2e
      run: docker compose -f docker-compose.e2e.yml up -d --build --wait && npm ci && npx playwright install --with-deps chromium firefox

    - name: Run tests
      working-directory: e2e
      run: npx playwright test

    - name: Show errors
      if: failure()
      working-directory: e2e
      run: docker compose -f docker-compose.e2e.yml logs backend
      
    - name: Stop app
      if: always()
      working-directory: e2e
      run: docker compose -f docker-compose.e2e.yml down -v

  frontend-lint-format:
    name: Frontend lint and format checks
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y git curl

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: expense_tracker_frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: expense_tracker_frontend
        run: npm ci

      - name: Format checks
        working-directory: expense_tracker_frontend
        run: npm run format

      - name: Lint checks
        working-directory: expense_tracker_frontend
        run: npm run lint

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain -uno)" ]; then
            echo "Repository has uncommitted changes after frontend lint/format checks"
            git status --porcelain -uno
            exit 1
          fi

  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y git curl

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: expense_tracker_frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: expense_tracker_frontend
        run: npm ci

      - name: Build checks
        working-directory: expense_tracker_frontend
        run: npm run build
